name: Prepare A1 Stage 8 Vercel source bundle
on:
  push:
    branches: [demo/osd-a1-stage1-20261025]
    paths: ['.github/workflows/a1-stage8-bundle.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Prepare text source manifests in isolated demo branch
        run: |
          git switch -c demo/osd-a1-stage8-bundle
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("osd-a1-demo")
          allowed=lambda p: str(p.relative_to(root)).replace("\\","/") in ("index.html","package.json","tsconfig.json","vite.config.ts","scripts/check-audio.mjs") or str(p.relative_to(root)).replace("\\","/").startswith(("src/","public/sw.js"))
          src=sorted([p for p in root.rglob("*") if p.is_file() and allowed(p)])
          out=pathlib.Path(".github/deploy-bundle")
          out.mkdir(parents=True,exist_ok=True)
          batch=[]
          index=1
          def write():
              global batch,index
              if batch:
                  (out/f"part-{index:02}.json").write_text(json.dumps({"files":batch},ensure_ascii=False),encoding="utf-8")
                  index+=1
                  batch=[]
          for path in src:
              rel=str(path.relative_to(root)).replace("\\","/")
              entry={"file":"src/"+rel,"data":path.read_text(encoding="utf-8"),"encoding":"utf-8"}
              if batch and len(json.dumps({"files":batch+[entry]},ensure_ascii=False).encode())>65000:write()
              batch.append(entry)
          write()
          print("Manifest parts:",index-1,"Source files:",len(src))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deploy-bundle
          git commit -m 'build(a1): temporary Vercel source manifests for stage 7'
          git push origin HEAD:refs/heads/demo/osd-a1-stage8-bundle
