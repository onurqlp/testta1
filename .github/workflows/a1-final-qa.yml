name: A1 Stage 8 Final Browser QA
on:
  push:
    branches: [demo/osd-a1-stage1-20261025]
    paths:
      - 'osd-a1-demo/**'
      - '.github/workflows/a1-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: osd-a1-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect dependencies without automatic major upgrades
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json');console.log('AUDIT:',JSON.stringify(a.metadata?.vulnerabilities||{}));for(const [name,v] of Object.entries(a.vulnerabilities||{}))console.log('ADVISORY',name,v.severity,JSON.stringify(v.fixAvailable));"
          npm audit --omit=dev --audit-level=high
      - name: Unit tests + MP3 + production build
        run: npm run test && npm run check:audio && npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview
        shell: bash
        run: |
          nohup npm run preview -- --port 4173 > /tmp/ayda-a1-preview.log 2>&1 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ayda-a1-preview.log
          exit 1
      - name: Run end-to-end responsive checks
        run: node scripts/e2e-final.mjs
      - name: Preserve screenshots + QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ayda-a1-stage8-browser-qa
          path: |
            osd-a1-demo/artifacts/qa
            osd-a1-demo/audit-report.json
          retention-days: 30
