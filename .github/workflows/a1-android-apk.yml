name: Build AYDA A1 Demo Android APK
on:
  push:
    branches: [demo/osd-a1-stage1-20261025]
    paths:
      - '.github/workflows/a1-android-apk.yml'
      - 'osd-a1-demo/android/**'
      - 'osd-a1-demo/src/**'
      - 'osd-a1-demo/public/**'
      - 'osd-a1-demo/index.html'
      - 'osd-a1-demo/package.json'
      - 'osd-a1-demo/vite.config.ts'
      - 'osd-a1-demo/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout A1 demo branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read original AYDA ÖSD A1 guide model images
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: onurqlp/osda1rehber
          ref: main
          path: osd-guide-source
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test and bundle A1 Web UI + entire 11-task exam guide
        working-directory: osd-a1-demo
        run: |
          npm install --no-fund --no-audit
          npm run test
          npm run check:audio
          npm run build
          test -s dist/index.html
          test -s dist/rehber/a1/index.html
          test -s dist/rehber/a1/content.js
          test -s dist/rehber/a1/app.js
          test -s dist/audio/alltag-01-aufgabe1.mp3
          test -s dist/branding/ayda-logo.png
          test -s dist/rehber/a1/ayda-brand.css
          grep -q 'brand-logo' src/App.tsx
          grep -q '#102541' src/brand.css
          grep -q '#e8c37b' src/brand.css
          test "$(sha256sum dist/branding/ayda-logo.png | cut -d ' ' -f1)" = "baa791945bb954a30bb415555e72f47b4425a861c7b7888999ee69f3d80642cd"
          test "$(sha256sum android/app/src/main/res/drawable-nodpi/ayda_master_logo.png | cut -d ' ' -f1)" = "baa791945bb954a30bb415555e72f47b4425a861c7b7888999ee69f3d80642cd"
      - name: Embed official example paper images and AYDA teaching scenes inside APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p osd-a1-demo/dist/rehber/a1/assets/model osd-a1-demo/dist/rehber/a1/assets/scene
          cp -a osd-guide-source/a1/assets/model/. osd-a1-demo/dist/rehber/a1/assets/model/
          for scene in shop cafe kitchen; do
            cp "osd-guide-source/assets/${scene}.webp" "osd-a1-demo/dist/rehber/a1/assets/scene/${scene}.webp"
          done
          sed -i 's#https://osd.aydadil.com/a1/assets/model/#assets/model/#g' osd-a1-demo/dist/rehber/a1/app.js
          sed -i 's#https://osd.aydadil.com/assets/#assets/scene/#g' osd-a1-demo/dist/rehber/a1/content.js
          test -s osd-a1-demo/dist/rehber/a1/assets/model/za1-page-02.jpg
          test -s osd-a1-demo/dist/rehber/a1/assets/model/za1-page-12.jpg
          test -s osd-a1-demo/dist/rehber/a1/assets/scene/shop.webp
          if grep -q 'https://osd.aydadil.com/a1/assets/model/' osd-a1-demo/dist/rehber/a1/app.js; then
            echo "Remote image link remained" >&2; exit 1
          fi
      - name: Package web application and guide inside the Android APK
        shell: bash
        run: |
          mkdir -p osd-a1-demo/android/app/src/main/assets/web
          cp -a osd-a1-demo/dist/. osd-a1-demo/android/app/src/main/assets/web/
          test -s osd-a1-demo/android/app/src/main/assets/web/index.html
          test -s osd-a1-demo/android/app/src/main/assets/web/rehber/a1/content.js
          test -s osd-a1-demo/android/app/src/main/assets/web/sw.js
      - name: Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165cb
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Ubuntu runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          echo "SDK_MANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
      - name: Install API 35 and build tools
        shell: bash
        run: |
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK with embedded A1 guide
        working-directory: osd-a1-demo/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate embedded guide, exam audio and manifest
        working-directory: osd-a1-demo/android
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | tee apk-contents.txt
          for file in \
            assets/web/index.html \
            assets/web/rehber/a1/index.html \
            assets/web/rehber/a1/content.js \
            assets/web/rehber/a1/app.js \
            assets/web/rehber/a1/style.css \
            assets/web/rehber/a1/ayda-brand.css \
            assets/web/branding/ayda-logo.png \
            assets/web/rehber/a1/ux-review.css \
            assets/web/rehber/a1/assets/model/za1-page-02.jpg \
            assets/web/rehber/a1/assets/model/za1-page-12.jpg \
            assets/web/rehber/a1/assets/scene/shop.webp \
            assets/web/audio/alltag-01-aufgabe1.mp3 \
            assets/web/sw.js; do
            grep -Fq "$file" apk-contents.txt || { echo "Missing APK content: $file" >&2; exit 1; }
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -12
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee permissions.txt
          grep -q 'android.permission.INTERNET' permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' permissions.txt
          if grep -Eq 'android.permission.(CAMERA|ACCESS_FINE_LOCATION|READ_EXTERNAL_STORAGE)' permissions.txt; then
            echo "Unexpected Android permission" >&2; exit 1
          fi
          cp "$apk" app/build/outputs/apk/debug/AYDA-OSD-A1-AYDA-UI-v0.10.apk
          sha256sum app/build/outputs/apk/debug/AYDA-OSD-A1-AYDA-UI-v0.10.apk
      - name: Upload downloadable guide APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AYDA-OSD-A1-AYDA-UI-v0.10-APK
          path: osd-a1-demo/android/app/build/outputs/apk/debug/AYDA-OSD-A1-AYDA-UI-v0.10.apk
          retention-days: 30
